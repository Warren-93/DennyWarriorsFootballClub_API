# Test-only overrides; never touches real infrastructure.
# No test performs a MongoDB operation (the feature under test is mocked, or
# Spring Security rejects the request first), and nothing at startup touches
# the database, so this URI only needs to be syntactically valid.
spring.data.mongodb.uri=mongodb://localhost:27017/club-api-test
spring.data.mongodb.auto-index-creation=false

club.name=Example FC
club.admin.bootstrap-enabled=false
club.league.sync-enabled=false

# Dummy value so the context can start. Not a real secret.
club.security.jwt.secret=test-only-jwt-secret-not-used-anywhere-real-0123456789
