spring.application.name=club-api

# Endpoints are versioned per controller under /api/v1/... (no context path).
server.port=${PORT:8080}
# Trust X-Forwarded-* from the hosting platform's proxy (Render, Fly, Railway...),
# so generated URLs (e.g. uploaded media) use the public https address.
server.forward-headers-strategy=framework

spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# MongoDB: REQUIRED. No fallback on purpose, so a missing variable fails at
# startup instead of silently pointing at the wrong database.
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}
# Creates the @Indexed indexes (unique usernames, unique article slugs...).
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------------------
# The club. Everything below maps onto ClubProperties (club.*); see that
# class for what each setting does and its default.
# ---------------------------------------------------------------------------
# Must match how the league data spells the club's name (case-insensitive).
club.name=${CLUB_NAME:Example FC}
club.timezone=${CLUB_TIMEZONE:Europe/London}
club.scoring.points-for-win=${POINTS_FOR_WIN:3}
club.scoring.points-for-draw=${POINTS_FOR_DRAW:1}
club.scoring.points-for-loss=${POINTS_FOR_LOSS:0}

# Security. JWT_SECRET is REQUIRED (32+ chars): openssl rand -base64 48
club.security.jwt.secret=${JWT_SECRET:}
club.security.jwt.issuer=${spring.application.name}
club.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
club.security.login-rate-limit-enabled=${LOGIN_RATE_LIMIT_ENABLED:true}

# First admin, created only while the users collection is empty.
club.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
club.admin.bootstrap-username=${ADMIN_USERNAME:admin}
club.admin.bootstrap-password=${ADMIN_PASSWORD:}

# League data: "manual" (admin panel) or "comet". See LeagueDataProvider.
club.league.provider=${LEAGUE_PROVIDER:manual}
club.league.sync-enabled=${LEAGUE_SYNC_ENABLED:true}
club.league.comet.fixtures-url=${COMET_FIXTURES_URL:}
club.league.comet.standings-url=${COMET_STANDINGS_URL:}

# Optional: the channel id (UC...), not the @handle. Blank turns videos off.
club.youtube.channel-id=${YOUTUBE_CHANNEL_ID:}

# Uploads: MediaService enforces club.media.max-file-size (default 5MB). The
# servlet limits only need to be at least that, so Spring doesn't reject the
# upload before MediaService can return a helpful message.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ---------------------------------------------------------------------------
# Health checks: point the hosting platform at /actuator/health
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Logging. SPRING_PROFILES_ACTIVE=prod switches to one JSON object per line
# (logback-spring.xml). LOGGING_LEVEL_HTTP=WARN silences request logging.
# ---------------------------------------------------------------------------
logging.level.HTTP=${LOGGING_LEVEL_HTTP:INFO}
logging.level.org.mongodb.driver=WARN
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-12logger{0}){cyan} %msg%n
