spring.application.name=DennyWarriorsAPI

# Endpoints are versioned per-controller under /api/v1/... (no context-path prefix).
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.jackson.serialization.write-dates-as-timestamps=false

# MongoDB — REQUIRED, no fallback on purpose. Set MONGODB_URI or
# SPRING_DATA_MONGODB_URI (locally and on Render) — the app fails fast on
# startup if neither is set, rather than silently using a stale/insecure
# default. The credential that used to be hardcoded here was committed to
# git history and must be rotated in Atlas (new DB user + password) before
# being retired — do not just delete the old user until the new one works.
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI}}


# JWT signing — MUST be at least 256 bits (32+ chars) and overridden in prod.
dwfc.jwt.secret=${DWFC_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
dwfc.jwt.expiration-ms=${DWFC_JWT_EXPIRATION_MS:86400000}
dwfc.jwt.refresh-expiration-ms=${DWFC_JWT_REFRESH_EXPIRATION_MS:604800000}
dwfc.jwt.issuer=${DWFC_JWT_ISSUER:denny-warriors-api}

# CORS — comma-separated list of allowed origins for the React client.
dwfc.security.allowed-origins=${DWFC_ALLOWED_ORIGINS:http://localhost:3000,https://warren-93.github.io, https://denny-warriors-football-club.vercel.app}

# Bootstrap admin — created on first boot if the users collection is empty.
# No password default on purpose (the old "warriors123" default was a real,
# publicly-committed weak password) — set DWFC_ADMIN_PASSWORD explicitly, or
# leave bootstrap disabled and create the first user another way.
dwfc.admin.bootstrap.enabled=${DWFC_ADMIN_BOOTSTRAP_ENABLED:true}
dwfc.admin.bootstrap.username=${DWFC_ADMIN_USERNAME:admin}
dwfc.admin.bootstrap.password=${DWFC_ADMIN_PASSWORD}

# Render health checks can target /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Request logging
# ---------------------------------------------------------------------------
# RequestLoggingFilter logs every endpoint hit with status + duration.
# Toggle at runtime via env var LOGGING_LEVEL_HTTP=WARN (or back to INFO).
logging.level.HTTP=${LOGGING_LEVEL_HTTP:INFO}

# Log format is controlled by logback-spring.xml via Spring profile: the
# default (no profile, or any profile other than "prod") keeps the compact
# colourised console pattern below. Set SPRING_PROFILES_ACTIVE=prod on Render
# to switch to one-JSON-object-per-line output instead.

# Tame the noisiest libraries so HTTP lines stand out.
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.web=INFO

# Force colour output even when stdout isn't a TTY (IDE consoles, Render logs).
spring.output.ansi.enabled=ALWAYS

# Compact console pattern: HH:mm:ss.SSS  LEVEL  logger  message
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-12logger){cyan} %msg%n

# Comet (Scottish FA) API — public read-only match/standings reports.
comet.api.fixtures-url=${COMET_FIXTURES_URL:https://www.scottishfacomet.co.uk/data-backend/api/public/areports/run/0/25/?API_KEY=0004U0ZB5851e40fbeeeb8219cfe5f0381a11b10514373acc8bdabc448d607df7eef4e791ead336b1c62e7f7d65ea31cd31b0aa3a4bb7627f882248e65f40da5}
comet.api.standings-url=${COMET_STANDINGS_URL:https://www.scottishfacomet.co.uk/data-backend/api/public/areports/run/0/25/?API_KEY=0004U0ZB3c98e4771ddf57f7d7941b0126cc7c3c4ad7a59bab5422e9f802ec0797b71d197aa1cb8b4c4681e614600bd819a54bd9a0c69351c4759eb33f6fcf57}

# League sync — how often the scheduled job pulls fixtures/standings from Comet (default 15 min, per spec).
# league.sync.enabled=false is a kill switch (also set in tests, so `mvn test` never
# hits the real Comet API / production MongoDB on context startup).
league.sync.enabled=${LEAGUE_SYNC_ENABLED:true}
league.sync.initial-delay-ms=${LEAGUE_SYNC_INITIAL_DELAY_MS:10000}
league.sync.interval-ms=${LEAGUE_SYNC_INTERVAL_MS:900000}

# Media upload (player photos, news images) — stored as binary in MongoDB
# (media_assets collection), see MediaService for the matching 5MB app-level
# check. These multipart limits just need to be >= that so uploads aren't
# rejected by Spring before ever reaching MediaService's own validation.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

