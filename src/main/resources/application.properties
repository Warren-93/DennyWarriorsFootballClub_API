spring.application.name=DennyWarriorsAPI

# All endpoints live under /api/dennywarriors to match the React client's
# REACT_APP_API_URL (http://localhost:8080/api/dennywarriors).
server.servlet.context-path=/api/dennywarriors
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.jackson.serialization.write-dates-as-timestamps=false

# MongoDB — for Render, set either MONGODB_URI or SPRING_DATA_MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://MWarren93:Esmie123@ac-qmfvrlx-shard-00-00.vroca2k.mongodb.net:27017,ac-qmfvrlx-shard-00-01.vroca2k.mongodb.net:27017,ac-qmfvrlx-shard-00-02.vroca2k.mongodb.net:27017/db-dennywarriors?ssl=true&replicaSet=atlas-bzifop-shard-0&authSource=admin&appName=Cluster0}}



# JWT signing — MUST be at least 256 bits (32+ chars) and overridden in prod.
dwfc.jwt.secret=${DWFC_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
dwfc.jwt.expiration-ms=${DWFC_JWT_EXPIRATION_MS:86400000}
dwfc.jwt.issuer=${DWFC_JWT_ISSUER:denny-warriors-api}

# CORS — comma-separated list of allowed origins for the React client.
dwfc.security.allowed-origins=${DWFC_ALLOWED_ORIGINS:http://localhost:3000,https://warren-93.github.io, https://denny-warriors-football-club.vercel.app}

# Bootstrap admin — created on first boot if the users collection is empty.
dwfc.admin.bootstrap.enabled=${DWFC_ADMIN_BOOTSTRAP_ENABLED:true}
dwfc.admin.bootstrap.username=${DWFC_ADMIN_USERNAME:admin}
dwfc.admin.bootstrap.password=${DWFC_ADMIN_PASSWORD:warriors123}

# Render health checks can target /api/dennywarriors/actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
