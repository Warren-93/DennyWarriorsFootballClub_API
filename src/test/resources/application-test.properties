# Test-only overrides — never touches real infrastructure.
# No test in this suite performs an actual MongoDB operation (either the
# feature under test is mocked, or the request is rejected by Spring
# Security before reaching a repository), so this connection string only
# needs to be syntactically valid; it is never actually connected to.
spring.data.mongodb.uri=mongodb://localhost:27017/dennywarriors-test

# Never seed a real admin user or fire a real league sync during a test run —
# both would otherwise hit production Comet/MongoDB the moment the Spring
# context loads (see SyncService's fixedDelay note).
dwfc.admin.bootstrap.enabled=false
league.sync.enabled=false

# Dummy values for settings that have no default in application.properties.
# Not real secrets — only used so the Spring context can start in tests.
dwfc.jwt.secret=test-only-jwt-secret-not-used-anywhere-real-0123456789
comet.api.fixtures-url=http://localhost/comet-fixtures-test
comet.api.standings-url=http://localhost/comet-standings-test
